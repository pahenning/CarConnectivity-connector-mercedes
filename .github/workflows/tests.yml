name: Python tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel protobuf requests
      - name: Install plugin without external runtime dependencies
        run: python -m pip install --no-deps -e .
      - name: Unit tests (offline fixtures)
        run: python -m unittest discover -s tests -v
      - name: Bytecode compilation
        run: python -m compileall -q src tests scripts
